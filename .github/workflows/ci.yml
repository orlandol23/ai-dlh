name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege by default. A job that needs to write (posting a PR comment,
# for example) declares its own `permissions:`, which replaces this one for
# that job rather than adding to it.
permissions:
  contents: read

jobs:
  # Test and statically analyse Smart Contracts
  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        working-directory: contracts
        run: npx hardhat compile

      - name: Run tests
        working-directory: contracts
        run: npx hardhat test

      # C1b — gas regression gate. Compares deployment and recordCompletion
      # against contracts/gas-baseline.json and fails past a 2% tolerance.
      # A4 depends on this: the subscription contract's gas budget is only
      # meaningful if a regression can actually break the build.
      - name: Gas regression gate
        working-directory: contracts
        run: npm run gas:check

      # C1b — Slither. Fails on medium and high findings; low and
      # informational are printed but do not block. Compilation already
      # happened above, so the analysis reads the existing build-info
      # instead of recompiling.
      #
      # Run from a pinned pip install rather than crytic/slither-action. The
      # action passes its inputs to docker as positionals, so `fail-on` never
      # reaches Slither, and its image is Python 3.9, which caps
      # slither-analyzer at 0.11.4 — a version that ignores the threshold from
      # the config file and from the command line alike. Under the action this
      # step reported success with a medium finding present, which is worse
      # than having no gate at all. Verified in the CI log: it installed
      # slither-analyzer 0.11.4.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip install slither-analyzer==0.11.6

      - name: Slither
        working-directory: contracts
        run: slither . --hardhat-ignore-compile --config-file slither.config.json --fail-medium

  # Test Backend
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Type-check (including tests)
        working-directory: server
        run: npx tsc --noEmit -p tsconfig.eslint.json

      - name: Unit tests
        working-directory: server
        run: npx vitest run

      - name: Build
        working-directory: server
        run: npm run build

  # Test Frontend
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `vite build` only transpiles (esbuild) and does NOT type-check;
      # this step is what actually catches type errors in the frontend.
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  # NOTE: there is intentionally no deploy job here. Deploys happen via the
  # platforms' git integrations, outside of GitHub Actions:
  #   - Frontend: Vercel builds and deploys pushes to main (vercel.json).
  #   - Backend:  Railway builds and deploys pushes to main (railway.toml).
  # The previous "Deploy to Vercel" job was an `echo` stub that only created
  # the illusion of a deploy step; it was removed to keep this pipeline honest.
