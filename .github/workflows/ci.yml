name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Test Smart Contracts
  test-contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        working-directory: contracts
        run: npx hardhat compile

      - name: Run tests
        working-directory: contracts
        run: npx hardhat test

      # Informational only: the size-contracts plugin is not installed in
      # this project, so this step must not be able to mask real failures.
      - name: Check contract size (informational)
        working-directory: contracts
        run: npx hardhat size-contracts || echo "size-contracts plugin not configured — skipping"

  # Test Backend
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Type-check (including tests)
        working-directory: server
        run: npx tsc --noEmit -p tsconfig.eslint.json

      - name: Unit tests
        working-directory: server
        run: npx vitest run

      - name: Build
        working-directory: server
        run: npm run build

  # Test Frontend
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `vite build` only transpiles (esbuild) and does NOT type-check;
      # this step is what actually catches type errors in the frontend.
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        run: npm run build

  # NOTE: there is intentionally no deploy job here. Deploys happen via the
  # platforms' git integrations, outside of GitHub Actions:
  #   - Frontend: Vercel builds and deploys pushes to main (vercel.json).
  #   - Backend:  Railway builds and deploys pushes to main (railway.toml).
  # The previous "Deploy to Vercel" job was an `echo` stub that only created
  # the illusion of a deploy step; it was removed to keep this pipeline honest.
