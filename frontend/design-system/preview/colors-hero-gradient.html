<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Hero gradient (v2)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-sans);}
  .wrap{padding:16px;display:grid;grid-template-columns:1.3fr 1fr;gap:12px;}
  .hero{position:relative;background:linear-gradient(135deg,#f5f3ff 0%,#ede9fe 40%,#cffafe 100%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;min-height:164px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
  .hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(to right,rgba(124,58,237,0.08) 1px,transparent 1px),linear-gradient(to bottom,rgba(124,58,237,0.08) 1px,transparent 1px);background-size:24px 24px;opacity:.9;pointer-events:none;}
  .hero h2{position:relative;margin:0;font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-0.03em;line-height:1.05;}
  .hero h2 span{background:linear-gradient(135deg,#7c3aed,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .hero p{position:relative;margin:10px 0 0;font-size:13px;color:#55504a;}
  .stops{display:grid;grid-template-rows:repeat(3,1fr);gap:6px;}
  .stop{border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px;}
  .chip{width:32px;height:32px;border-radius:8px;border:1px solid rgba(0,0,0,0.05);flex:0 0 auto;}
  .name{font-size:11px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h2>Aprenda com <span>IA</span>.<br>Certifique em <span>cadeia</span>.</h2>
    <p>Hero gradient 135° · roxo→ciano · único gradiente decorativo.</p>
  </div>
  <div class="stops">
    <div class="stop"><div class="chip" style="background:#f5f3ff"></div><div><div class="name">0% — violet 50</div><div class="hex">#F5F3FF</div></div></div>
    <div class="stop"><div class="chip" style="background:#ede9fe"></div><div><div class="name">40% — violet 100</div><div class="hex">#EDE9FE</div></div></div>
    <div class="stop"><div class="chip" style="background:#cffafe"></div><div><div class="name">100% — cyan 100</div><div class="hex">#CFFAFE</div></div></div>
  </div>
</div>
</body></html>
