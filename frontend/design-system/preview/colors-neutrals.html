<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Neutral scale (v2 · warm)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:var(--font-sans);color:var(--foreground);}
  .wrap{padding:20px 24px;}
  .eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.18em;color:var(--muted-foreground);margin-bottom:10px;}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
  .sw{border-radius:6px;overflow:hidden;border:1px solid var(--border);}
  .chip{height:48px;}
  .meta{padding:6px 6px 8px;}
  .name{font-size:10px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:9px;color:var(--muted-foreground);}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Neutros warm — leve tinta quente, não cinza-azulado</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#fbfaf9"></div><div class="meta"><div class="name">25</div><div class="hex">FBFAF9</div></div></div>
    <div class="sw"><div class="chip" style="background:#f7f5f3"></div><div class="meta"><div class="name">50</div><div class="hex">F7F5F3</div></div></div>
    <div class="sw"><div class="chip" style="background:#efece8"></div><div class="meta"><div class="name">100</div><div class="hex">EFECE8</div></div></div>
    <div class="sw"><div class="chip" style="background:#e2ddd6"></div><div class="meta"><div class="name">200</div><div class="hex">E2DDD6</div></div></div>
    <div class="sw"><div class="chip" style="background:#c9c2b8"></div><div class="meta"><div class="name">300</div><div class="hex">C9C2B8</div></div></div>
    <div class="sw"><div class="chip" style="background:#a29a8f"></div><div class="meta"><div class="name">400</div><div class="hex">A29A8F</div></div></div>
    <div class="sw"><div class="chip" style="background:#55504a"></div><div class="meta"><div class="name">600</div><div class="hex">55504A</div></div></div>
    <div class="sw"><div class="chip" style="background:#3a3632"></div><div class="meta"><div class="name">700</div><div class="hex">3A3632</div></div></div>
    <div class="sw"><div class="chip" style="background:#24221f"></div><div class="meta"><div class="name">800</div><div class="hex">24221F</div></div></div>
    <div class="sw"><div class="chip" style="background:#161514"></div><div class="meta"><div class="name">900</div><div class="hex">161514</div></div></div>
  </div>
</div>
</body></html>
