<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Card (v2)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-sans);background:#fbfaf9;color:#161514;}
  .wrap{padding:18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{background:#fff;border:1px solid #e2ddd6;border-radius:10px;box-shadow:0 1px 3px 0 rgba(76,29,149,.08),0 1px 2px -1px rgba(76,29,149,.06);overflow:hidden;}
  .head{padding:20px 20px 8px;}
  .title{font-size:20px;font-weight:600;letter-spacing:-0.01em;margin:0;line-height:1.1;}
  .desc{font-size:14px;color:#766e63;margin:6px 0 0;}
  .body{padding:12px 20px 20px;font-size:14px;color:#24221f;}
  .stat{padding:22px;text-align:center;}
  .stat .n{font-family:"Space Grotesk",Inter,sans-serif;font-size:44px;font-weight:700;color:#7c3aed;line-height:1;letter-spacing:-0.02em;}
  .stat .l{font-family:"JetBrains Mono",monospace;font-size:11px;color:#766e63;margin-top:8px;text-transform:uppercase;letter-spacing:0.18em;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head"><h3 class="title">Gerar Novo Módulo</h3><p class="desc">Use IA para criar conteúdo personalizado</p></div>
    <div class="body">form content…</div>
  </div>
  <div class="card stat"><div class="n">12</div><div class="l">Total Módulos</div></div>
</div>
</body></html>
