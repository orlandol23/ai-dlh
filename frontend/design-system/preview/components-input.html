<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Input (v2)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-sans);background:#fff;color:#161514;}
  .wrap{padding:18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:#24221f;}
  input,select{height:40px;width:100%;border:1px solid #e2ddd6;background:#fff;border-radius:6px;padding:0 12px;font-family:inherit;font-size:14px;color:#161514;box-sizing:border-box;transition:all 200ms cubic-bezier(.22,1,.36,1);}
  input:focus,select:focus{outline:none;border-color:#7c3aed;box-shadow:0 0 0 2px #fff,0 0 0 4px #8b5cf6;}
  input::placeholder{color:#a29a8f;}
  .meta{grid-column:1/-1;font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);}
</style>
</head>
<body>
<div class="wrap">
  <div class="group">
    <label>Tópico de Estudo</label>
    <input type="text" placeholder="Ex: TypeScript, React Hooks…">
  </div>
  <div class="group">
    <label>Nível</label>
    <select><option>Iniciante</option><option>Intermediário</option><option>Avançado</option></select>
  </div>
  <div class="meta">h-10 · radius 6 · focus = anel duplo roxo (2px bg + 4px primary-500)</div>
</div>
</body></html>
