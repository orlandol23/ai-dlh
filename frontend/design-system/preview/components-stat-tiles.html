<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Stat tiles (v2)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-sans);background:#fbfaf9;}
  .wrap{padding:18px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .card{background:#fff;border:1px solid #e2ddd6;border-radius:10px;box-shadow:0 1px 3px 0 rgba(76,29,149,.08);padding:20px 16px;}
  .l{font-family:"JetBrains Mono",monospace;font-size:11px;color:#766e63;text-transform:uppercase;letter-spacing:0.18em;}
  .n{font-family:"Space Grotesk",Inter,sans-serif;font-size:42px;font-weight:700;line-height:1;letter-spacing:-0.02em;margin-top:8px;}
  .nmono{font-family:"JetBrains Mono",monospace;font-weight:600;letter-spacing:0;}
  .violet{color:#7c3aed;} .green{color:#16a34a;} .cyan{color:#0891b2;}
  .hint{font-size:12px;color:#766e63;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><div class="l">Total Módulos</div><div class="n">12</div><div class="hint">+3 esta semana</div></div>
  <div class="card"><div class="l">Aprovados</div><div class="n green">9</div></div>
  <div class="card"><div class="l">Score Médio</div><div class="n nmono cyan">84</div><div class="hint">de 100</div></div>
  <div class="card"><div class="l">On-chain</div><div class="n nmono violet">7</div></div>
</div>
</body></html>
