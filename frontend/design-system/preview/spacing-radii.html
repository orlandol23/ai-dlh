<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Radii (v2)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-sans);background:#fff;}
  .wrap{padding:18px 24px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:68px;height:68px;background:#ede9fe;border:1px solid #c4b5fd;}
  .name{font-size:12px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);}
</style>
</head>
<body>
<div class="wrap">
  <div class="cell"><div class="box" style="border-radius:4px"></div><div class="name">xs</div><div class="hex">4px</div></div>
  <div class="cell"><div class="box" style="border-radius:6px"></div><div class="name">sm</div><div class="hex">6px</div></div>
  <div class="cell"><div class="box" style="border-radius:10px"></div><div class="name">base · md</div><div class="hex">10px</div></div>
  <div class="cell"><div class="box" style="border-radius:14px"></div><div class="name">lg</div><div class="hex">14px</div></div>
  <div class="cell"><div class="box" style="border-radius:20px"></div><div class="name">xl</div><div class="hex">20px</div></div>
  <div class="cell"><div class="box" style="border-radius:9999px"></div><div class="name">full</div><div class="hex">pill</div></div>
</div>
</body></html>
