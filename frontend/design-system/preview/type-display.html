<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Type — display (v2)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-sans);color:var(--foreground);background:#fff;}
  .wrap{padding:20px 24px;}
  h1.display{font-family:var(--font-display);font-size:64px;font-weight:700;letter-spacing:-0.04em;line-height:1.02;margin:0;}
  .accent{background:linear-gradient(135deg,#7c3aed,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);margin-top:14px;letter-spacing:0.04em;}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="display">Aprenda com <span class="accent">IA</span></h1>
  <div class="meta">Display · Space Grotesk · 48 → 96px · weight 700 · tracking −0.04em</div>
</div>
</body></html>
