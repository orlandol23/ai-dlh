<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Type — mono (v2)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-sans);color:var(--foreground);background:#fff;}
  .wrap{padding:18px 24px;display:grid;gap:12px;}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .kv{font-family:var(--font-mono);font-size:13px;}
  .dim{color:var(--muted-foreground);}
  .pill{display:inline-flex;align-items:center;background:#f5f3ff;border:1px solid #ddd6fe;color:#4c1d95;border-radius:999px;padding:4px 10px;font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;}
  .big{font-family:var(--font-mono);font-size:32px;font-weight:600;color:#7c3aed;letter-spacing:-0.02em;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);letter-spacing:0.04em;}
</style>
</head>
<body>
<div class="wrap">
  <div class="meta">JetBrains Mono · expressivo — não só código</div>
  <div class="row"><span class="big">92%</span><span class="kv dim">score · stat expressivo</span></div>
  <div class="row"><span class="pill">⛓ ON-CHAIN</span><span class="pill">Sepolia</span><span class="pill">Block 5_234_891</span></div>
  <div class="row"><span class="kv">0x742d35Cc…f4Bb</span><span class="kv dim">wallet</span></div>
  <div class="row"><span class="kv">tx 0x9a3e7b2f4c1d8e6a2b9c…</span></div>
  <div class="row"><span class="kv dim">// sepolia testnet</span></div>
</div>
</body></html>
