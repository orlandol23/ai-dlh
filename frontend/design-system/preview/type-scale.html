<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Type — scale (v2)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;font-family:var(--font-sans);color:var(--foreground);background:#fff;}
  .wrap{padding:18px 24px;}
  .row{display:grid;grid-template-columns:150px 1fr;gap:8px 18px;align-items:baseline;padding:4px 0;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);}
  h2{font-family:var(--font-display);font-size:36px;font-weight:700;margin:0;line-height:1.1;letter-spacing:-0.02em;}
  h3{font-size:24px;font-weight:600;margin:0;line-height:1.2;letter-spacing:-0.01em;}
  h4{font-size:20px;font-weight:600;margin:0;}
  .body{font-size:16px;line-height:1.5;margin:0;}
  .small{font-size:14px;color:var(--muted-foreground);margin:0;}
  .caption{font-size:12px;color:var(--muted-foreground);margin:0;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.18em;color:var(--muted-foreground);margin:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><div class="meta">H2 / 36 / SpaceGK</div><h2>Como Funciona</h2></div>
  <div class="row"><div class="meta">CardTitle / 24</div><h3>Gerar Novo Módulo</h3></div>
  <div class="row"><div class="meta">H4 / 20</div><h4>Conecte sua Carteira</h4></div>
  <div class="row"><div class="meta">Body / 16 / Inter</div><p class="body">Use MetaMask para autenticar via Web3.</p></div>
  <div class="row"><div class="meta">Small / 14 / muted</div><p class="small">12 módulos gerados</p></div>
  <div class="row"><div class="meta">Caption / 12</div><p class="caption">0x742d35…f4Bb</p></div>
  <div class="row"><div class="meta">Eyebrow / 12 mono</div><p class="eyebrow">ON-CHAIN RECEIPT</p></div>
</div>
</body></html>
