<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AI-DLH v2 — Design System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { font-family: var(--font-sans); background: var(--background); color: var(--foreground); }
  .sg { font-family: var(--font-display); letter-spacing: -0.02em; }
  .mono { font-family: var(--font-mono); }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); height: 44px; padding: 0 20px; border-radius: var(--radius); font-weight: 600; transition: all var(--duration) var(--ease-out); border: 0; cursor: pointer; }
  .btn-primary:hover { box-shadow: var(--shadow-glow); transform: translateY(-1px); }
  .btn-outline { background: transparent; color: var(--foreground); height: 44px; padding: 0 20px; border-radius: var(--radius); font-weight: 600; border: 1px solid var(--border); cursor: pointer; transition: all var(--duration); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-ghost { background: transparent; color: var(--foreground); height: 36px; padding: 0 12px; border-radius: var(--radius-sm); border: 0; cursor: pointer; }
  .btn-ghost:hover { background: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; background: var(--onchain-bg); color: var(--onchain-fg); border: 1px solid var(--onchain-border); text-transform: uppercase; letter-spacing: 0.1em; }
  .pill-accent { background: var(--info-bg); color: var(--info-fg); border-color: var(--info-border); }
  .dot-pulse { width: 8px; height: 8px; border-radius: 999px; background: currentColor; animation: pulse-dot 1.4s var(--ease-out) infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }

  /* AI streaming caret */
  .caret::after { content: '▋'; color: var(--primary); animation: blink 1s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Blockchain stamp animation */
  @keyframes stamp-in {
    0% { opacity: 0; transform: scale(2) rotate(-12deg); }
    50% { opacity: 1; transform: scale(0.95) rotate(-8deg); }
    100% { opacity: 1; transform: scale(1) rotate(-8deg); }
  }
  .stamp { animation: stamp-in 600ms var(--ease-out) both; }

  /* Skeleton shimmer */
  @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: calc(200px + 100%) 0; } }
  .skeleton {
    background: linear-gradient(90deg, var(--muted) 0%, rgba(255,255,255,0.5) 50%, var(--muted) 100%);
    background-size: 200px 100%;
    animation: shimmer 1.5s linear infinite;
    border-radius: var(--radius-sm);
  }
  .dark .skeleton { background: linear-gradient(90deg, #24221f 0%, #3a3632 50%, #24221f 100%); }

  /* Sparkline grid */
  .spark path { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 2s var(--ease-out) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  section { padding: 72px 24px; max-width: 1280px; margin: 0 auto; }
  .section-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .section-head .num { font-family: var(--font-mono); font-size: 13px; color: var(--muted-foreground); letter-spacing: 0.1em; }
  .section-head h2 { margin: 0; font-size: 36px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ======================= Theme toggle =======================
function useTheme() {
  const [theme, setTheme] = useState(() => localStorage.getItem('aidlh_theme') || 'light');
  useEffect(() => {
    document.documentElement.dataset.theme = theme;
    document.documentElement.classList.toggle('dark', theme === 'dark');
    localStorage.setItem('aidlh_theme', theme);
  }, [theme]);
  return [theme, setTheme];
}

// ======================= Nav =======================
function TopNav({ theme, setTheme }) {
  return (
    <header className="sticky top-0 z-50 backdrop-blur" style={{background:'color-mix(in srgb, var(--background) 80%, transparent)', borderBottom:'1px solid var(--border)'}}>
      <div className="max-w-[1280px] mx-auto px-6 h-16 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <Logo size={32}/>
          <span className="sg font-bold text-xl">AI-DLH</span>
          <span className="eyebrow ml-2" style={{color:'var(--muted-foreground)'}}>Design System · v2</span>
        </div>
        <div className="flex gap-2">
          <a href="#tokens" className="btn-ghost">Tokens</a>
          <a href="#components" className="btn-ghost">Components</a>
          <a href="#states" className="btn-ghost">States</a>
          <a href="#dashboard" className="btn-ghost">Dashboard</a>
          <button className="btn-outline" style={{height:36, padding:'0 14px'}} onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}>
            {theme === 'dark' ? '☀️ Light' : '🌙 Dark'}
          </button>
        </div>
      </div>
    </header>
  );
}

// ======================= Special states =======================
function AIStreaming() {
  const [text, setText] = useState('');
  const full = 'React Hooks te permitem usar estado e efeitos colaterais sem classes. O hook mais fundamental é o useState — ele devolve uma tupla com o valor atual e uma função de atualização.';
  useEffect(() => {
    let i = 0;
    const id = setInterval(() => {
      setText(full.slice(0, i));
      i += 2;
      if (i > full.length) i = 0;
    }, 40);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="panel p-6 hash-grid">
      <div className="flex items-center justify-between mb-3">
        <span className="pill-accent pill"><span className="dot-pulse"/> IA gerando</span>
        <span className="mono text-xs" style={{color:'var(--muted-foreground)'}}>gemini-2.0-flash</span>
      </div>
      <div className="sg mb-2" style={{fontSize:20,fontWeight:600}}>React Hooks Avançados</div>
      <p className="body caret">{text}</p>
    </div>
  );
}

function BlockchainStamp() {
  const [stamped, setStamped] = useState(false);
  useEffect(() => {
    const id = setInterval(() => setStamped(s => !s), 2400);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="panel p-6 relative hash-grid" style={{minHeight:220}}>
      <div className="eyebrow">certificado</div>
      <div className="sg mt-2" style={{fontSize:32,fontWeight:700}}>React Hooks Avançados</div>
      <div className="mt-2 text-sm" style={{color:'var(--muted-foreground)'}}>Score 92% · aprovado</div>
      <div className="mono mt-3 text-xs break-all" style={{color:'var(--muted-foreground)'}}>0xabc123ef4567…9f4e2d</div>
      {stamped && (
        <div className="stamp absolute" style={{right:24,top:24,padding:'8px 14px',border:'3px solid var(--primary)',borderRadius:10,color:'var(--primary)',fontFamily:'var(--font-mono)',fontWeight:700,fontSize:13,letterSpacing:'0.1em',background:'var(--onchain-bg)'}}>
          ⛓ ON-CHAIN
        </div>
      )}
      <button className="btn-ghost mt-4" onClick={() => setStamped(false) || setTimeout(()=>setStamped(true),80)}>Replay animation</button>
    </div>
  );
}

// ======================= Dashboard redesign =======================
function StatTile({ label, value, hint, accent, mono }) {
  return (
    <div className="panel p-5">
      <div className="eyebrow">{label}</div>
      <div className={`stat-number ${mono?'mono':''}`} style={{color:accent||'var(--foreground)', marginTop:8}}>{value}</div>
      {hint && <div className="caption mt-1">{hint}</div>}
    </div>
  );
}

function Sparkline() {
  const points = [20,28,26,45,52,50,68,72,70,82,80,92];
  const pts = points.map((p,i)=>`${i*(340/(points.length-1))},${100-p}`).join(' ');
  return (
    <svg viewBox="0 0 340 100" className="spark" style={{width:'100%',height:100,overflow:'visible'}}>
      <defs>
        <linearGradient id="fillG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#7c3aed" stopOpacity="0.3"/>
          <stop offset="100%" stopColor="#7c3aed" stopOpacity="0"/>
        </linearGradient>
        <linearGradient id="strokeG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="#7c3aed"/>
          <stop offset="100%" stopColor="#22d3ee"/>
        </linearGradient>
      </defs>
      <polygon points={`0,100 ${pts} 340,100`} fill="url(#fillG)"/>
      <polyline points={pts} fill="none" stroke="url(#strokeG)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {points.map((p,i)=> i===points.length-1 && <circle key={i} cx={i*(340/(points.length-1))} cy={100-p} r="4" fill="#22d3ee" stroke="#fff" strokeWidth="2"/>)}
    </svg>
  );
}

function Timeline() {
  const items = [
    { t: 'Há 2h',  title: 'React Hooks Avançados', score: 92, level: 'Intermediate', hash: '0xabc…9f4e' },
    { t: 'Ontem',  title: 'TypeScript Essentials', score: 84, level: 'Beginner',     hash: '0xdef…7a2c' },
    { t: '3 dias', title: 'Solidity Patterns',     score: 76, level: 'Advanced',     hash: '0x123…5e8f' },
  ];
  return (
    <div className="panel p-6">
      <div className="flex items-center justify-between mb-4">
        <div className="eyebrow">Certificados on-chain</div>
        <span className="mono text-xs" style={{color:'var(--muted-foreground)'}}>sepolia</span>
      </div>
      <div className="relative">
        <div className="absolute" style={{left:11,top:8,bottom:8,width:2,background:'linear-gradient(to bottom,var(--primary),var(--accent))',opacity:.4}}/>
        {items.map((it,i) => (
          <div key={i} className="flex gap-4 py-3 relative">
            <div style={{width:24,height:24,borderRadius:999,background:'var(--onchain-bg)',border:'2px solid var(--primary)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,flexShrink:0,zIndex:1}}>⛓</div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2">
                <div className="font-semibold text-sm truncate">{it.title}</div>
                <div className="mono text-xs" style={{color:'var(--muted-foreground)'}}>{it.t}</div>
              </div>
              <div className="flex items-center gap-3 mt-1">
                <span className="mono text-xs" style={{color:'var(--primary)'}}>{it.score}%</span>
                <span className="caption">{it.level}</span>
                <a className="mono text-xs ml-auto" style={{color:'var(--accent-600)'}}>{it.hash} ↗</a>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AchievementBadges() {
  const b = [
    { e:'🔥', t:'Streak 7 dias', c:'#d97706' },
    { e:'🎯', t:'3× 90%+', c:'#7c3aed' },

function DashboardV2() {
  return (

// ======================= Copy dictionary =======================
function CopyDict() {
  const entries = [
    ['CTA primária',   'Começar Agora',            'Title Case, pt-BR, verbo imperativo'],
    ['CTA secundária', 'Saiba Mais',               'mesma regra'],
    ['Auth',           'Conectar Carteira',        'nunca "Entrar" ou "Login"'],
    ['Geração IA',     '🤖 Gerar com IA',          'emoji + verbo'],
    ['Loading IA',     '⏳ A IA está criando…',    'reticências, lowercase após emoji'],
    ['Aprovado',       '🎉 Parabéns! Você foi aprovado!', 'exclamação no fim'],
    ['Reprovado',      'Não foi desta vez',        'sem ponto final, tom suave'],
    ['On-chain',       '⛓️ Registrado na Blockchain!', 'título case em "Blockchain"'],
    ['Empty state',    'Nenhum módulo ainda',      'Gere seu primeiro módulo com IA ←'],
    ['Endereço',       '0x742d35…f4Bb',            'sempre mono, truncado 6+4'],
  ];
  return (
    <div className="panel p-6">
      <div className="eyebrow mb-4">Dicionário de copy (pt-BR canônico)</div>
      <div className="grid gap-1 text-sm">
        {entries.map(([k,v,r]) => (
          <div key={k} className="grid grid-cols-[140px_1fr_1fr] gap-4 py-2" style={{borderBottom:'1px solid var(--border)'}}>
            <div className="caption">{k}</div>
            <div className="font-medium">{v}</div>
            <div className="caption">{r}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
