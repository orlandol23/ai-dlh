# Railway configuration for the backend service.
#
# Railway/Railpack auto-detects this is a Node monorepo from the root
# package.json. Without an explicit buildCommand it would run the root
# `build` script — which builds frontend AND backend. The frontend is
# already deployed via Vercel, so we don't need it here, and forcing
# tsc to recompile the frontend's vite output is both pointless and
# slow. Pin the build to the backend workspace only.

[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run build:backend"

[deploy]
startCommand = "node server/dist/index.js"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
